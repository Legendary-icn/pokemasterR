<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PokeMaster Elite v21.0 - OFFLINE EDITION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #00f2ff; --red: #ff1f1f; --bg: #0a0a0c; --panel: #16161a; --text: #e0e0e0; --gold: #ffd700; --green: #00ff88; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; user-select: none; }

        /* NAVEGACIÓN */
        .top-nav { 
            display: flex; background: #000; overflow-x: auto; position: sticky; top: 0; z-index: 1000;
            border-bottom: 2px solid var(--neon); scrollbar-width: none;
        }
        .top-nav button {
            flex: 1; padding: 12px; border: none; background: none; color: #666;
            font-size: 0.65rem; font-weight: bold; cursor: pointer; text-transform: uppercase;
            min-width: 80px; transition: 0.3s;
        }
        .top-nav button.active { color: var(--neon); background: rgba(0, 242, 255, 0.1); }
        .top-nav button i { display: block; font-size: 1.1rem; margin-bottom: 4px; }

        /* CONTENEDORES */
        .content { padding: 15px; padding-bottom: 80px; }
        .panel { display: none; animation: fadeIn 0.3s; }
        .active-panel { display: block; }
        
        .card-card {
            background: var(--panel); border-radius: 12px; padding: 10px;
            border: 1px solid #333; margin-bottom: 10px; display: flex; align-items: center; gap: 15px;
        }

        /* BOTONES */
        .btn { 
            background: var(--neon); color: #000; border: none; padding: 12px; 
            border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; 
            margin-top: 5px; font-size: 0.8rem; text-transform: uppercase;
        }
        .btn-search { background: var(--gold); color: #000; }
        .btn-google { background: #4285F4; color: white; }

        /* FORMULARIOS */
        input { 
            width: calc(100% - 24px); padding: 12px; background: #222; 
            border: 1px solid #444; color: white; border-radius: 8px; margin-bottom: 10px; 
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<nav class="top-nav">
    <button class="active" onclick="showTab('search', this)"><i class="fas fa-search"></i> Buscador</button>
    <button onclick="showTab('packs', this)"><i class="fas fa-box-open"></i> Abrir Sobres</button>
    <button onclick="showTab('dex', this)"><i class="fas fa-book"></i> Mi Colección</button>
</nav>

<div class="content">
    
    <div id="tab-search" class="panel active-panel">
        <h3 style="color:var(--neon)">CONSULTA DE CARTAS</h3>
        <p style="font-size:0.8rem; color:#888">Escribe el nombre de la carta para buscar precios e imágenes en la red.</p>
        
        <input type="text" id="mainSearch" placeholder="Ej: Charizard ex 151...">
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
            <button class="btn btn-search" onclick="searchExternal('tcgplayer')">
                <i class="fas fa-dollar-sign"></i> VER PRECIOS
            </button>
            <button class="btn btn-google" onclick="searchExternal('pokemon')">
                <i class="fas fa-image"></i> VER IMAGEN
            </button>
        </div>

        <div id="search-history" style="margin-top:20px">
            <small style="color:var(--neon)">BÚSQUEDAS RECIENTES</small>
            <div id="history-list"></div>
        </div>
    </div>

    <div id="tab-packs" class="panel">
        <div class="card-card" style="flex-direction: column; text-align: center;">
            <i class="fas fa-box-open fa-3x" style="color:var(--gold); margin-bottom:10px"></i>
            <h3>SIMULADOR DE SOBRE</h3>
            <p style="font-size:0.8rem">Al no usar APIs, registra aquí la carta que te salió físicamente para guardarla en tu Dex.</p>
            <input type="text" id="newCardName" placeholder="Nombre de la carta...">
            <button class="btn" onclick="registerCard()">REGISTRAR EN MI DEX</button>
        </div>
    </div>

    <div id="tab-dex" class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
            <h3 style="color:var(--neon)">MI DEX</h3>
            <span id="card-count" style="background:var(--neon); color:#000; padding:2px 8px; border-radius:10px; font-weight:bold; font-size:0.8rem">0</span>
        </div>
        <div id="dex-list">
            </div>
        <button class="btn" style="background:var(--red); color:white; margin-top:20px" onclick="clearDex()">BORRAR TODO</button>
    </div>

</div>

<script>
    // ESTADO DE LA APP
    let app = {
        dex: JSON.parse(localStorage.getItem('pkm_dex_local') || '[]'),
        history: JSON.parse(localStorage.getItem('pkm_history') || '[]')
    };

    // FUNCIÓN DE BÚSQUEDA EXTERNA (ELIMINA NECESIDAD DE API)
    function searchExternal(platform) {
        const query = document.getElementById('mainSearch').value.trim();
        if(!query) return alert("Escribe el nombre de una carta");

        saveHistory(query);
        let url = "";

        if(platform === 'tcgplayer') {
            // Buscador directo de TCGPlayer
            url = `https://www.tcgplayer.com/search/pokemon/product?q=${encodeURIComponent(query)}&view=grid`;
        } else {
            // Buscador en la web oficial de Pokémon España
            url = `https://www.pokemon.com/es/jcc-pokemon/cartas-pokemon/?cardName=${encodeURIComponent(query)}`;
        }

        window.open(url, '_blank');
    }

    // REGISTRO LOCAL DE CARTAS
    function registerCard() {
        const name = document.getElementById('newCardName').value.trim();
        if(!name) return alert("Escribe el nombre");

        const newCard = {
            id: Date.now(),
            name: name,
            date: new Date().toLocaleDateString()
        };

        app.dex.push(newCard);
        updateStorage();
        renderDex();
        document.getElementById('newCardName').value = "";
        alert("¡Carta guardada!");
    }

    // RENDERIZADO DE COLECCIÓN
    function renderDex() {
        const container = document.getElementById('dex-list');
        const countLabel = document.getElementById('card-count');
        
        container.innerHTML = app.dex.length === 0 ? '<p style="text-align:center; color:#555">No tienes cartas registradas.</p>' : '';
        countLabel.innerText = app.dex.length;

        app.dex.slice().reverse().forEach(card => {
            const div = document.createElement('div');
            div.className = 'card-card';
            div.innerHTML = `
                <div style="background:var(--neon); width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#000">
                    <i class="fas fa-bolt"></i>
                </div>
                <div style="flex:1">
                    <div style="font-weight:bold">${card.name}</div>
                    <div style="font-size:0.7rem; color:#888">Registrada: ${card.date}</div>
                </div>
                <button onclick="deleteCard(${card.id})" style="background:none; border:none; color:var(--red); cursor:pointer">
                    <i class="fas fa-trash"></i>
                </button>
            `;
            container.appendChild(div);
        });
    }

    // GESTIÓN DE HISTORIAL
    function saveHistory(q) {
        if(!app.history.includes(q)) {
            app.history.unshift(q);
            if(app.history.length > 5) app.history.pop();
            updateStorage();
            renderHistory();
        }
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = app.history.map(h => `
            <div style="display:inline-block; background:#222; padding:5px 10px; border-radius:15px; margin:5px 5px 0 0; font-size:0.7rem; cursor:pointer" onclick="fillSearch('${h}')">
                ${h}
            </div>
        `).join('');
    }

    function fillSearch(val) {
        document.getElementById('mainSearch').value = val;
    }

    // UTILIDADES
    function deleteCard(id) {
        app.dex = app.dex.filter(c => c.id !== id);
        updateStorage();
        renderDex();
    }

    function clearDex() {
        if(confirm("¿Seguro que quieres borrar toda tu colección?")) {
            app.dex = [];
            updateStorage();
            renderDex();
        }
    }

    function updateStorage() {
        localStorage.setItem('pkm_dex_local', JSON.stringify(app.dex));
        localStorage.setItem('pkm_history', JSON.stringify(app.history));
    }

    function showTab(tabId, btn) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active-panel'));
        document.querySelectorAll('.top-nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active-panel');
        btn.classList.add('active');
    }

    window.onload = () => {
        renderDex();
        renderHistory();
    };
</script>

</body>
</html>
